workflows:
  build_android:
    name: Build Android APK
    environment:
      flutter: stable
    scripts:
      - flutter create . --platforms=android --org com.sportslive --project-name sports_streaming_app
      - flutter pub get
      - flutter analyze
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
